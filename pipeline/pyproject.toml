[project]
name = "mijnstraat"
version = "0.1.0"
description = "Datapijplijn voor Mijn Straat: open overheidsdata per adres, lokaal samengevat"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mijnstraat = "mijnstraat.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mijnstraat*"]
